name: Verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject tracked files covered by ignore rules
        shell: bash
        run: |
          ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [[ -n "$ignored" ]]; then
            printf 'Remove these ignored files from Git tracking:\n%s\n' "$ignored"
            exit 1
          fi
      - run: docker build -t multi-chain-wallet-test .
      - run: docker run --rm -v "$PWD:/app:ro" -v test_modules:/go/pkg/mod multi-chain-wallet-test go mod download
      - run: mkdir -p /tmp/multi-chain-wallet-results
      - run: docker run --rm --network none -v "$PWD:/app:ro" -v test_modules:/go/pkg/mod:ro -v /tmp/multi-chain-wallet-results:/results -e GOCACHE=/tmp/cache multi-chain-wallet-test sh -c 'go test -race -count=1 -coverprofile=/results/coverage.out ./... && go vet ./... && test -z "$(gofmt -l cmd internal contracts tests)" && go fix -diff ./... > /results/gofix.diff && test ! -s /results/gofix.diff'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: /tmp/multi-chain-wallet-results/coverage.out
  solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --ignore-scripts --prefix contracts
      - run: npm run check --prefix contracts
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - run: cd tests/browser && npx playwright install --with-deps chromium
      - name: Browser fixtures and local simulated EVM E2E
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test --prefix tests/browser 2>&1 | tee test-results/browser-fixtures.log
          npm run test:e2e --prefix tests/browser 2>&1 | tee test-results/browser-e2e.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-logs
          path: test-results/browser-*.log
          retention-days: 14
  deployment:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests/deployment -p 'test_*.py'
      - run: docker build -f Dockerfile.deploy --build-arg APP_VERSION="$GITHUB_SHA" -t wallet-smoke .
      - run: python3 tests/deployment/smoke.py wallet-smoke "$GITHUB_SHA"
  publish:
    needs: [go, solidity, browser, deployment, vulnerabilities]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEMO_DEPLOY_ENABLED == 'true' && vars.DEMO_DEPLOY_REPOSITORY == github.repository
    runs-on: ${{ vars.DEMO_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build and test exact release image
        run: |
          docker build -f Dockerfile.deploy --build-arg APP_VERSION="$GITHUB_SHA" -t "ghcr.io/a861252012/multi-chain-wallet:sha-$GITHUB_SHA" .
          python3 tests/deployment/smoke.py "ghcr.io/a861252012/multi-chain-wallet:sha-$GITHUB_SHA" "$GITHUB_SHA"
      - name: Publish immutable image
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/a861252012/multi-chain-wallet:sha-$GITHUB_SHA"
          docker push "$image"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          digest=${ref#*@}
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Sign and verify the tested release digest
        env:
          RELEASE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/a861252012/multi-chain-wallet@$RELEASE_DIGEST"
          cosign sign --yes "$image"
          cosign verify \
            --certificate-identity 'https://github.com/a861252012/multi-chain-wallet/.github/workflows/verify.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository 'a861252012/multi-chain-wallet' \
            --certificate-github-workflow-ref 'refs/heads/main' \
            --certificate-github-workflow-trigger 'push' \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$image" >/dev/null
      - name: Notify VM to check the signed release
        if: vars.DEMO_NOTIFY_ENABLED == 'true'
        env:
          DEMO_NOTIFY_SECRET: ${{ secrets.DEMO_NOTIFY_SECRET }}
          DEMO_NOTIFY_GATE: ${{ secrets.DEMO_NOTIFY_GATE }}
        run: python3 scripts/deploy/send-notify.py "$GITHUB_SHA"
      - if: always()
        run: docker logout ghcr.io
  live:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEMO_DEPLOY_ENABLED == 'true' && vars.DEMO_DEPLOY_REPOSITORY == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - run: cd tests/browser && npx playwright install --with-deps chromium
      - name: Verify deployed revision and browser flows
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VAULT_ADDRESS: ${{ vars.EXPECTED_VAULT_ADDRESS }}
          EXPECTED_ESCROW_ADDRESS: ${{ vars.EXPECTED_ESCROW_ADDRESS }}
          WALLET_DEMO_URL: https://wallet.tedlin.fyi
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:live --prefix tests/browser 2>&1 | tee test-results/live.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-ui-test-log
          path: test-results/live.log
          retention-days: 14
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check reachable known Go vulnerabilities
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            golang:1.26-alpine@sha256:ce864e7223ac17b1775e6fd0b4c0db580c2eb50e7953a427916379e4b92a1628 \
            sh -c 'go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 && govulncheck ./cmd/... ./internal/...'
